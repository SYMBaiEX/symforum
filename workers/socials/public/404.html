<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Signal not found — SYMBiEX</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #f4f1e8;
        background: #10100f;
        font-family: ui-monospace, monospace;
      }
      main {
        width: min(100% - 2rem, 40rem);
        border: 1px solid #f4f1e8;
        padding: clamp(2rem, 8vw, 5rem);
      }
      p {
        color: #a9a69d;
        line-height: 1.7;
      }
      a {
        color: #54e0ca;
        text-underline-offset: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404 / Signal not found</h1>
      <p>This channel does not exist or has moved.</p>
      <a href="/">Return to the network</a>
    </main>
  </body>
</html>
