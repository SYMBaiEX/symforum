<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SYMBiEX's Socials</title>
    <meta
      name="description"
      content="Official links for Austin Hamilton and SYMBiEX."
    />
    <meta name="theme-color" content="#10100f" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="SYMBiEX's Socials" />
    <meta
      property="og:description"
      content="Official links for Austin Hamilton and SYMBiEX."
    />
    <meta property="og:url" content="https://socials.symbaiex.com/" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://socials.symbaiex.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4f1e8;
        --paper: #10100f;
        --muted: #a9a69d;
        --line: rgba(244, 241, 232, 0.24);
        --cyan: #55dfcb;
        --pink: #ff4fa3;
        --yellow: #f3df58;
        --orange: #ff8b5c;
        --blue: #7db8ff;
        --violet: #c493ff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--paper);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      }

      a {
        color: inherit;
      }

      .skip-link {
        position: fixed;
        left: 1rem;
        top: 1rem;
        z-index: 10;
        padding: 0.75rem 1rem;
        color: var(--paper);
        background: var(--ink);
        transform: translateY(-200%);
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .shell {
        width: min(100% - 2rem, 56rem);
        margin: 0 auto;
        padding: 0 0 2rem;
      }

      .masthead {
        display: grid;
        grid-template-columns: clamp(7.5rem, 18vw, 10rem) minmax(0, 1fr);
        align-items: center;
        gap: clamp(2rem, 6vw, 4.5rem);
        padding: clamp(2rem, 5vw, 3.5rem) 0;
        border-bottom: 1px solid var(--ink);
      }

      .portrait {
        position: relative;
        margin: 0;
        aspect-ratio: 4 / 5;
        border: 1px solid var(--ink);
        box-shadow:
          0.55rem 0.55rem 0 var(--pink),
          -0.35rem -0.35rem 0 var(--cyan);
        transform: rotate(-1.5deg);
      }

      .portrait img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .masthead h1 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        font-size: clamp(3rem, 8vw, 5.8rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.88;
      }

      .masthead h1 span {
        display: block;
        width: fit-content;
        margin-top: 0.08em;
        color: var(--pink);
        text-shadow: 0.055em 0.055em 0 var(--cyan);
      }

      .links-heading {
        padding: clamp(1.5rem, 4vw, 2.5rem) 0 0.65rem;
      }

      h2 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        font-size: clamp(1.65rem, 4vw, 2.5rem);
        font-weight: 400;
        letter-spacing: -0.045em;
      }

      .link-list {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--ink);
      }

      .signal-link {
        display: grid;
        grid-template-columns: 3.5rem minmax(0, 1fr) auto;
        align-items: center;
        gap: 1rem;
        min-height: 4.65rem;
        padding: 0.65rem 0;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
        transition:
          color 180ms ease,
          padding 180ms ease,
          background 180ms ease;
      }

      .signal-link:hover,
      .signal-link:focus-visible {
        padding-right: 1rem;
        padding-left: 1rem;
        color: var(--paper);
        background: var(--ink);
        outline: none;
      }

      .signal-link[data-accent="cyan"]:hover,
      .signal-link[data-accent="cyan"]:focus-visible {
        background: var(--cyan);
      }

      .signal-link[data-accent="pink"]:hover,
      .signal-link[data-accent="pink"]:focus-visible {
        background: var(--pink);
      }

      .signal-link[data-accent="yellow"]:hover,
      .signal-link[data-accent="yellow"]:focus-visible {
        background: var(--yellow);
      }

      .signal-link[data-accent="orange"]:hover,
      .signal-link[data-accent="orange"]:focus-visible {
        background: var(--orange);
      }

      .signal-link[data-accent="blue"]:hover,
      .signal-link[data-accent="blue"]:focus-visible {
        background: var(--blue);
      }

      .signal-link[data-accent="violet"]:hover,
      .signal-link[data-accent="violet"]:focus-visible {
        background: var(--violet);
      }

      .index {
        color: var(--muted);
        font-size: 0.68rem;
      }

      .signal-link:hover .index,
      .signal-link:focus-visible .index {
        color: currentColor;
      }

      .network {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        font-size: clamp(1.45rem, 3.5vw, 2.25rem);
        letter-spacing: -0.04em;
      }

      .handle {
        display: block;
        margin-top: 0.25rem;
        color: var(--muted);
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .signal-link:hover .handle,
      .signal-link:focus-visible .handle {
        color: currentColor;
      }

      .arrow {
        font-size: 1.35rem;
        transition: transform 180ms ease;
      }

      .signal-link:hover .arrow,
      .signal-link:focus-visible .arrow {
        transform: translate(0.25rem, -0.25rem);
      }

      footer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2rem;
        padding-top: 1.5rem;
        color: var(--muted);
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        line-height: 1.6;
        text-transform: uppercase;
      }

      @media (max-width: 720px) {
        .shell {
          width: min(100% - 1.25rem, 56rem);
        }

        .masthead {
          grid-template-columns: 6.75rem minmax(0, 1fr);
          gap: 1.25rem;
          padding: 1.75rem 0;
        }

        .portrait {
          box-shadow:
            0.35rem 0.35rem 0 var(--pink),
            -0.2rem -0.2rem 0 var(--cyan);
        }

        footer {
          grid-template-columns: 1fr;
        }

        .signal-link {
          grid-template-columns: 2.25rem minmax(0, 1fr) auto;
          min-height: 4.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#links">Skip to social links</a>
    <div class="shell">
      <header class="masthead">
        <figure class="portrait">
          <img
            src="/about-symbiex-portrait-dark.webp"
            alt="Stylized SYMBaiEX portrait in a neon city scene"
            width="960"
            height="1200"
            decoding="async"
          />
        </figure>
        <h1>SYMBiEX's <span>Socials</span></h1>
      </header>

      <main>
        <section id="links" aria-labelledby="links-title">
          <div class="links-heading">
            <h2 id="links-title">Links</h2>
          </div>

          <ol class="link-list">
            <li>
              <a
                class="signal-link"
                data-accent="cyan"
                href="https://x.com/SYMBiEX"
                rel="me noopener noreferrer"
              >
                <span class="index">01</span>
                <span class="network"
                  >X <span class="handle">@SYMBiEX</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a
                class="signal-link"
                data-accent="pink"
                href="https://github.com/SYMBaiEX"
                rel="me noopener noreferrer"
              >
                <span class="index">02</span>
                <span class="network"
                  >GitHub <span class="handle">@SYMBaiEX</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a
                class="signal-link"
                data-accent="yellow"
                href="https://www.linkedin.com/in/austinhamiltonal"
                rel="me noopener noreferrer"
              >
                <span class="index">03</span>
                <span class="network"
                  >LinkedIn <span class="handle">Austin Hamilton</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a
                class="signal-link"
                data-accent="orange"
                href="https://forum.symbaiex.com/"
              >
                <span class="index">04</span>
                <span class="network"
                  >Forum <span class="handle">forum.symbaiex.com</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a
                class="signal-link"
                data-accent="blue"
                href="https://www.symbaiex.com/"
              >
                <span class="index">05</span>
                <span class="network"
                  >Website <span class="handle">symbaiex.com</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a
                class="signal-link"
                data-accent="violet"
                href="mailto:austin@symbaiex.com?subject=SYMBiEX%20social%20contact"
              >
                <span class="index">06</span>
                <span class="network"
                  >Email <span class="handle">austin@symbaiex.com</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
          </ol>
        </section>
      </main>

      <footer>
        <span>© 2026 SYMBiEX</span>
      </footer>
    </div>
  </body>
</html>
