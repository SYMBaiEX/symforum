<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SYMBiEX's Socials</title>
    <meta
      name="description"
      content="Official links for Austin Hamilton and SYMBiEX."
    />
    <meta name="theme-color" content="#10100f" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="SYMBiEX's Socials" />
    <meta
      property="og:description"
      content="Official links for Austin Hamilton and SYMBiEX."
    />
    <meta property="og:url" content="https://socials.symbaiex.com/" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://socials.symbaiex.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4f1e8;
        --paper: #10100f;
        --muted: #a9a69d;
        --line: rgba(244, 241, 232, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--paper);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      }

      a {
        color: inherit;
      }

      .skip-link {
        position: fixed;
        left: 1rem;
        top: 1rem;
        z-index: 10;
        padding: 0.75rem 1rem;
        color: var(--paper);
        background: var(--ink);
        transform: translateY(-200%);
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .shell {
        width: min(100% - 2rem, 64rem);
        margin: 0 auto;
        padding: 0 0 4rem;
      }

      .masthead {
        padding: clamp(4rem, 11vw, 8rem) 0 clamp(2rem, 5vw, 4rem);
        border-bottom: 1px solid var(--ink);
      }

      .masthead h1 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        font-size: clamp(3rem, 8vw, 6.5rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }

      .links-heading {
        padding: clamp(2.5rem, 6vw, 4.5rem) 0 1rem;
      }

      h2 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        font-size: clamp(2rem, 5vw, 4rem);
        font-weight: 400;
        letter-spacing: -0.045em;
      }

      .link-list {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--ink);
      }

      .signal-link {
        display: grid;
        grid-template-columns: 3.5rem minmax(0, 1fr) auto;
        align-items: center;
        gap: 1rem;
        min-height: 6.8rem;
        padding: 1rem 0;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
        transition:
          color 180ms ease,
          padding 180ms ease,
          background 180ms ease;
      }

      .signal-link:hover,
      .signal-link:focus-visible {
        padding-right: 1rem;
        padding-left: 1rem;
        color: var(--paper);
        background: var(--ink);
        outline: none;
      }

      .index {
        color: var(--muted);
        font-size: 0.68rem;
      }

      .signal-link:hover .index,
      .signal-link:focus-visible .index {
        color: currentColor;
      }

      .network {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        font-size: clamp(1.75rem, 4vw, 3.1rem);
        letter-spacing: -0.04em;
      }

      .handle {
        display: block;
        margin-top: 0.25rem;
        color: var(--muted);
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .signal-link:hover .handle,
      .signal-link:focus-visible .handle {
        color: currentColor;
      }

      .arrow {
        font-size: 1.75rem;
        transition: transform 180ms ease;
      }

      .signal-link:hover .arrow,
      .signal-link:focus-visible .arrow {
        transform: translate(0.25rem, -0.25rem);
      }

      footer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2rem;
        padding-top: 2.5rem;
        color: var(--muted);
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        line-height: 1.6;
        text-transform: uppercase;
      }

      @media (max-width: 720px) {
        .shell {
          width: min(100% - 1.25rem, 64rem);
        }

        footer {
          grid-template-columns: 1fr;
        }

        .signal-link {
          grid-template-columns: 2.25rem minmax(0, 1fr) auto;
          min-height: 5.75rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#links">Skip to social links</a>
    <div class="shell">
      <header class="masthead">
        <h1>SYMBiEX's Socials</h1>
      </header>

      <main>
        <section id="links" aria-labelledby="links-title">
          <div class="links-heading">
            <h2 id="links-title">Links</h2>
          </div>

          <ol class="link-list">
            <li>
              <a
                class="signal-link"
                href="https://x.com/SYMBiEX"
                rel="me noopener noreferrer"
              >
                <span class="index">01</span>
                <span class="network"
                  >X <span class="handle">@SYMBiEX</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a
                class="signal-link"
                href="https://github.com/SYMBaiEX"
                rel="me noopener noreferrer"
              >
                <span class="index">02</span>
                <span class="network"
                  >GitHub <span class="handle">@SYMBaiEX</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a
                class="signal-link"
                href="https://www.linkedin.com/in/austinhamiltonal"
                rel="me noopener noreferrer"
              >
                <span class="index">03</span>
                <span class="network"
                  >LinkedIn <span class="handle">Austin Hamilton</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a class="signal-link" href="https://forum.symbaiex.com/">
                <span class="index">04</span>
                <span class="network"
                  >Forum <span class="handle">forum.symbaiex.com</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a class="signal-link" href="https://www.symbaiex.com/">
                <span class="index">05</span>
                <span class="network"
                  >Website <span class="handle">symbaiex.com</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a
                class="signal-link"
                href="mailto:solsymbaiex@gmail.com?subject=SYMBiEX%20social%20contact"
              >
                <span class="index">06</span>
                <span class="network"
                  >Email <span class="handle">solsymbaiex@gmail.com</span></span
                >
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
          </ol>
        </section>
      </main>

      <footer>
        <span>© 2026 SYMBiEX</span>
      </footer>
    </div>
  </body>
</html>
