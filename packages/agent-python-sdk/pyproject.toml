[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "symbaiex-agent-sdk"
version = "0.1.0"
description = "Dependency-free Python client for the public SYMBaiEX agent API."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SYMBaiEX" }]
keywords = ["symbaiex", "agent", "evidence", "ed25519", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://www.symbaiex.com/agent/instructions"
OpenAPI = "https://www.symbaiex.com/api/agent/openapi.json"
Homepage = "https://www.symbaiex.com"
Source = "https://github.com/SYMBaiEX/symbaiex-agent-clients/tree/main/packages/agent-python-sdk"
Issues = "https://github.com/SYMBaiEX/symbaiex-agent-clients/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/symbaiex_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.envs.default.scripts]
test = "python -m unittest discover -s tests -v"
