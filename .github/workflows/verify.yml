name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun ci
      - run: bun install --cwd workers/eliza-shadow --frozen-lockfile --ignore-scripts
      - run: bun install --cwd workers/eliza-shadow-gateway --frozen-lockfile --ignore-scripts
      - run: bun run eliza:check && bun run eliza:test
      - run: bunx playwright install --with-deps chromium
      - run: bun run verify
      - run: bun run ui:check
      - run: bun run test:forum:render
