name: Agent SDK release checks

on:
  pull_request:
    paths:
      - "packages/agent-sdk/**"
      - "packages/agent-cli/**"
      - "packages/agent-python-sdk/**"
      - "apps/platform/app/api/agent/openapi.json/**"
      - "apps/platform/app/api/agent/mcp/**"
      - "apps/platform/app/api/agent/asyncapi.json/**"
      - "contracts/asyncapi/**"
      - "lib/agent-data-api-relay.ts"
      - "scripts/webhook-cert-core.ts"
      - "scripts/verify-agent-contract-parity.*"
      - "docs/agent-contract-parity.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/agent-sdk-release.yml"
  push:
    branches: [main]
    paths:
      - "packages/agent-sdk/**"
      - "packages/agent-cli/**"
      - "packages/agent-python-sdk/**"
      - "apps/platform/app/api/agent/openapi.json/**"
      - "apps/platform/app/api/agent/mcp/**"
      - "apps/platform/app/api/agent/asyncapi.json/**"
      - "contracts/asyncapi/**"
      - "lib/agent-data-api-relay.ts"
      - "scripts/webhook-cert-core.ts"
      - "scripts/verify-agent-contract-parity.*"
      - "docs/agent-contract-parity.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/agent-sdk-release.yml"

permissions:
  contents: read

jobs:
  typescript-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - run: bun scripts/verify-agent-contract-parity.mjs
      - run: bun run --filter @symbaiex/agent-sdk build
      - run: bun run --filter @symbaiex/agent-sdk test
      - run: bun run --filter @symbaiex/agent-sdk pack:check
      - run: bun run --filter @symbaiex/agent-cli build
      - run: bun run --filter @symbaiex/agent-cli test
      - run: bun run --filter @symbaiex/agent-cli pack:check

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-python-sdk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m pip install --disable-pip-version-check build==1.2.2.post1
      - run: python -m build --wheel --sdist
